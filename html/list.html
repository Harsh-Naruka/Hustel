<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My list</h1>

    <h2>Unordered list</h2>
    <ul>
        <li>1
            <ol>
                <li>h1</li>
                <li>h2</li>
            </ol>
        </li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>
    <h3>Ordered list</h3>
    <ol type="a">
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ol>

    <dl>
        <dt>Coffee</dt>
        <dd>ice coffee</dd>
        <dd>hot coffee</dd>
        <dd>macha</dd>
    </dl>

    <h3>Test 1</h3>
    <p>test 2</p>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Suscipit, tenetur! <span>test 3</span></p>
</body>
</html>
