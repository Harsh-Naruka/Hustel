<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: #1a1a1a;
        margin: 0;
        padding: 0px;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: #a6a4a4e4;
        border-radius: 8px;
        padding: 30px;
        width: 300px;
      }

      h2{
        color: #1a1a1a;
        text-align: center;
        margin-bottom: 20px;
      }

      form{
        display: flex;
        flex-direction: column;
      }

      input{
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 5px;
        border: none;
        background-color: #1a1a1a;
      }

      button{
        background-color: #1b81da;
        border: none;
        color: aliceblue;
        padding: 10px;
        border-radius: 7px;
        cursor: pointer;
      }

      button:hover{
        background-color: #0618be;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Login</h2>
      <form action="">

        <input type="email" name="" id="" placeholder="Email"/>

        <input type="password" name="" id="" placeholder="Password"/>
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
