<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms one</title>
    <link rel="stylesheet" href="./cs1.css">
</head>
<body>
    <h1>forms in html</h1>
    <form action="url" method="get" accept-charset="utf-16" autocomplete="off" enctype="" novalidate>
        <label for="fname">first name:</label>
        <input type="text" placeholder="first name" name="" value="harsh" id="fname">
        <input type="reset" value="reset">
        <input type="week" name="" id="">
        <br>
        <input type="submit" value="submit">

        <br>
        <select name="editor" id="">
            <option value="vscode">vscode</option>
            <option value="vscode1">vscode1</option>
            <option value="vscode2">vscode2</option>
        </select>

        <inputlist="editors" name="editor">
        <datalist id="editors">
            <option value="vscode">vscode</option>
            <option value="vscode1">vscode1</option>
            <option value="vscode2">vscode2</option>
        </datalist>
    </form>
</body>
</html>
