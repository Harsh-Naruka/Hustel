<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css</title>
    <style>
        * {
            background-color: rgb(47, 47, 34);
        }
        .green{
            background-color: green;
        }
        #red{
            background-color: red;
        }
        a[target="_blank"]{
            background-color: brown;
        }
        a[target="_parent"]{
            background-color:pink;
            padding: 10px;
        }
        h1, h2, h3{
            background-color: papayawhip;
        }
    </style>
</head>
<body>
    <h1>Lorem ipsum dolor sit amet.</h1>
    <h2 class="green">Lorem ipsum dolor sit amet.</h2>
    <h3 id="red" class="green">Lorem ipsum dolor sit amet.</h3>

    <a target="_parent" href="https://google.com">Google</a>
    <a target="_blank" href="https://www.youtube.com/watch?v=WuiB5TAQOAM&t=2122s">Youtube</a>


</body>
</html>
